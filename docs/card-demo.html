<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-cost-crystal</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #e7ecf3 0%, #d8e0eb 100%);
    font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .ds-balance-card {
    width: 256px;
    padding: 12px 14px 13px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.98);
    color: #23262f;
    border: 1px solid rgba(15, 23, 42, 0.06);
    box-shadow: 0 20px 44px rgba(15, 23, 42, 0.22), 0 5px 14px rgba(15, 23, 42, 0.12);
    cursor: pointer;
    user-select: none;
  }
  .ds-balance-card__head { display: flex; align-items: center; gap: 6px; opacity: .82; margin-bottom: 3px; white-space: nowrap; }
  .ds-balance-card__dot { width: 7px; height: 7px; border-radius: 50%; background: #4D6BFE; flex: none; }
  .ds-balance-card__brand { background: linear-gradient(90deg, #4D6BFE 0%, #4D6BFE 40%, #C9D6FF 50%, #4D6BFE 60%, #4D6BFE 100%); color: #0000; -webkit-text-fill-color: transparent; background-position: 100% 0; background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; font-weight: 600; }
  .ds-balance-card__src { font-size: 10px; opacity: .8; padding: 0 5px; border: 1px solid rgba(0,0,0,.18); border-radius: 999px; white-space: nowrap; }
  .ds-balance-card__rate { font-size: 11px; font-weight: 600; opacity: .9; white-space: nowrap; margin-left: auto; }
  .ds-balance-card__tpsnum { font-weight: 650; color: #4ade80; }
  .ds-balance-card__amtrow { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .ds-balance-card__amtcol { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
  .ds-balance-card__time { font-size: 9px; font-weight: 400; opacity: .4; letter-spacing: .3px; line-height: 1; }
  .ds-balance-card__amtlabel { font-size: 10.5px; font-weight: 400; opacity: .6; letter-spacing: .3px; }
  .ds-balance-card__amt { font-size: 17px; font-weight: 650; letter-spacing: .2px; }
  .ds-balance-card__usage { font-size: 10.5px; font-weight: 400; opacity: .72; letter-spacing: .2px; margin-left: auto; }
  .ds-balance-card__period { margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; white-space: nowrap; }
  .ds-balance-card__badge { font-size: 10.5px; font-weight: 650; padding: 1px 7px; border-radius: 999px; letter-spacing: .3px; }
  .ds-balance-card__badge--offpeak { background: rgba(16,185,129,.12); color: #047857; border: 1px solid rgba(4,120,87,.35); }
  .ds-balance-card__next { opacity: .8; font-size: 11px; }
  .ds-balance-card__divider { border-top: 1px solid rgba(0,0,0,.12); margin-top: 6px; }
  .ds-balance-card__forecast { font-size: 11px; opacity: .75; margin-top: 4px; text-align: left; letter-spacing: .3px; }
  .ds-balance-card__cost { font-weight: 650; color: #000; }
</style>
</head>
<body>
  <div class="ds-balance-card" title="点击立即刷新">
    <div class="ds-balance-card__head">
      <span class="ds-balance-card__dot" title="运行中 134 tok/s"></span>
      <span class="ds-balance-card__brand">DeepSeek</span>
      <span class="ds-balance-card__src" title="模型: deepseek-v4-flash">官方 API</span>
      <span class="ds-balance-card__rate" title="运行中 · 实时 134 tok/s"><span class="ds-balance-card__tpsnum">134</span><span> tok/s</span></span>
    </div>
    <div class="ds-balance-card__amtrow">
      <div class="ds-balance-card__amtcol">
        <span class="ds-balance-card__time" title="更新于 22:41:29">刚刚</span>
        <span class="ds-balance-card__amtlabel">余额</span>
      </div>
      <span class="ds-balance-card__amt" title="充值 ¥85.52 / 赠送 ¥0.00">¥85.52</span>
      <span class="ds-balance-card__usage" title="仅本机 Harness 会话;官方政策价估算 / 调用 3037 次">近24h ¥36.58</span>
    </div>
    <div class="ds-balance-card__period" title="波峰时段(本地): 10:00-13:00, 15:00-19:00">
      <span class="ds-balance-card__badge ds-balance-card__badge--offpeak">低峰</span>
      <span class="ds-balance-card__next">下次调整 11小时18分(明日10:00AM)</span>
    </div>
    <div class="ds-balance-card__divider"></div>
    <div class="ds-balance-card__forecast" title="预计输入 184.0k(含上下文 183.5k)+ 输出 556 · deepseek-v4-flash 估算">
      🔮 此次预测 0.2M tok · <span class="ds-balance-card__cost">¥0.0053</span>
    </div>
  </div>
</body>
</html>
